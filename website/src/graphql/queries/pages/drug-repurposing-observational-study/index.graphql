  ) {
    title
    content {
      json
    }
  }
  stopDrugOrSideEffectsAccordion: accordion(
    locale: $locale
    id: $stopDrugOrSideEffectsAccordionId
  ) {
    title
    content {
      json
    }
  }
  joinToStayInRegistryAccordion: accordion(
    locale: $locale
    id: $joinToStayInRegistryAccordionId
  ) {
    title
    content {
      json
    }
  }
